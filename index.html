<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rexven | Finans Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#07101f;color:#e2e8f0}
:root{--s1:#0d1e35;--s2:#0a1628;--s3:#061221;--b1:#1e3a5f;--b2:#162d4a;--t1:#e2e8f0;--t2:#94a3b8;--t3:#475569;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--gold:#f0b429}
#app{display:flex;flex-direction:column;height:100vh}
.hdr{background:linear-gradient(135deg,#0a1628,#0d1e35);border-bottom:1px solid var(--b1);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.brand{font-size:20px;font-weight:900;color:var(--gold)}
.brand span{font-size:11px;font-weight:500;color:var(--t3);letter-spacing:3px;text-transform:uppercase;margin-left:8px}
.nav{display:flex;padding:0 28px;background:var(--s2);border-bottom:1px solid var(--b2);flex-shrink:0}
.nav button{padding:12px 20px;border:none;background:none;color:var(--t3);font-weight:600;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:inherit}
.nav button.on{color:var(--gold);border-bottom:2px solid var(--gold)}
.dash{flex:1;display:grid;grid-template-rows:auto 1fr;gap:12px;padding:14px 24px;overflow:hidden;min-height:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi{border-radius:14px;padding:18px 20px;position:relative;overflow:hidden;border:1px solid}
.kpi-bar{position:absolute;top:0;left:0;right:0;height:4px}
.kpi-lbl{font-size:12px;font-weight:700;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
.kpi-v{font-size:28px;font-weight:800;letter-spacing:-1px;line-height:1}
.kpi-s{font-size:13px;color:var(--t3);margin-top:6px}
.mgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;min-height:0;overflow:hidden}
.col-mid{display:flex;flex-direction:column;gap:12px;min-height:0}
.col-right{display:flex;flex-direction:column;gap:12px;min-height:0}
.card{background:var(--s1);border:1px solid var(--b2);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ch{padding:14px 18px 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ch-title{font-size:12px;font-weight:700;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase}
.rows{flex:1;overflow-y:auto;padding:8px 10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:7px;margin-bottom:3px;font-size:14px}
.row:nth-child(odd){background:var(--s2)}
.rl{color:var(--t2)}
.rv{font-weight:600;color:var(--t1)}
.tot-bar{padding:10px 18px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--b2);flex-shrink:0}
.tot-lbl{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.tot-v{font-size:16px;font-weight:800}
.bdg{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid}
.krow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:9px;margin-bottom:5px;background:var(--s2);border:1px solid var(--b2);font-size:13px}
.kicon{font-size:16px;flex-shrink:0}
.ktext{flex:1;min-width:0}
.kbaslik{font-weight:600;color:var(--t1);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kacik{color:var(--t3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mform{padding:10px 12px;border-bottom:1px solid var(--b2);background:var(--s3);flex-shrink:0;display:none}
.mform.open{display:block}
.mform-row{display:flex;gap:8px;margin-bottom:8px}
.minp{flex:1;background:var(--s2);border:1px solid var(--b2);border-radius:7px;padding:8px 11px;color:var(--t1);font-size:13px;outline:none;font-family:inherit}
.minp:focus{border-color:var(--blue)}
.msel{flex:1;background:var(--s2);border:1px solid var(--b2);border-radius:7px;padding:8px 11px;color:var(--t1);font-size:13px;outline:none;font-family:inherit}
.msel option{background:var(--s1)}
.mbtn{padding:7px 14px;border-radius:7px;border:1px solid var(--b1);background:var(--s1);color:#93c5fd;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;white-space:nowrap}
.mbtn.ok{background:#052e16;color:#86efac;border-color:#16a34a}
.mbtn.del{background:none;border:none;color:var(--red);cursor:pointer;font-size:14px}
.warn{background:#3b000030;border:1px solid #7f1d1d;border-radius:9px;padding:6px 14px;color:#fca5a5;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.scroll-tab{flex:1;overflow-y:auto;padding:24px 28px}
.inp{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:9px;padding:11px 14px;color:var(--t1);font-size:14px;outline:none;font-family:inherit}
.inp:focus{border-color:var(--blue)}
.lbl{font-size:12px;font-weight:600;color:var(--t3);margin-bottom:5px;display:block}
.scard{background:var(--s1);border:1px solid var(--b2);border-radius:14px;padding:18px;margin-bottom:14px}
.sch{font-size:12px;font-weight:700;color:var(--t3);letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.savebtn{width:100%;padding:14px;border-radius:11px;border:none;background:linear-gradient(135deg,var(--gold),#d97706);color:#07101f;cursor:pointer;font-weight:800;font-size:16px;font-family:inherit;margin-top:10px}
.copybtn{padding:9px 18px;border-radius:9px;border:1px solid var(--b1);background:transparent;color:#93c5fd;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit}
.epre{background:var(--s1);border:1px solid var(--b2);border-radius:14px;padding:22px;font-family:'Courier New',monospace;font-size:13px;line-height:1.8;color:var(--t2);white-space:pre-wrap;word-break:break-word;margin-top:16px}
.hcard{background:var(--s1);border:1px solid var(--b2);border-radius:14px;padding:16px 20px;cursor:pointer;margin-bottom:10px}
.hcard:hover,.hcard.on{border-color:var(--blue)}
/* Dinamik satır girişi */
.drow-group{margin-bottom:10px}
.drow-sec{font-size:12px;font-weight:700;color:var(--blue);margin:14px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--b2);display:flex;justify-content:space-between;align-items:center}
.drow-item{display:grid;grid-template-columns:1fr 160px 36px;gap:8px;margin-bottom:6px;align-items:center}
.drow-total{display:flex;justify-content:space-between;padding:8px 12px;border-radius:8px;margin-top:6px;margin-bottom:2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DM={tamamlandi:{bg:'#052e16',c:'#86efac',b:'#16a34a',l:'✅ Tamam'},aksiyon:{bg:'#431407',c:'#fdba74',b:'#ea580c',l:'⚡ Aksiyon'},devam:{bg:'#0c1a2e',c:'#93c5fd',b:'#3b82f6',l:'🔄 Devam'}};
const PM={istifa:{bg:'#3b0000',c:'#fca5a5',b:'#dc2626',l:'İstifa'},parttime:{bg:'#3b2000',c:'#fcd34d',b:'#d97706',l:'Part-Time'},aktif:{bg:'#052e16',c:'#86efac',b:'#16a34a',l:'Aktif'}};
const fmt=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'USD',minimumFractionDigits:2}).format(parseFloat(n)||0);
const fmtK=n=>{const v=parseFloat(n)||0;if(Math.abs(v)>=1e6)return'$'+(v/1e6).toFixed(1)+'M';if(Math.abs(v)>=1000)return'$'+(v/1000).toFixed(0)+'K';return fmt(v)};
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const bdg=(type,d)=>{const m=type==='k'?DM:PM,x=m[d]||m.devam;return`<span class="bdg" style="background:${x.bg};color:${x.c};border-color:${x.b}">${x.l}</span>`};
const sum=arr=>(arr||[]).reduce((s,r)=>s+(parseFloat(r.v)||0),0);

// Boş hafta şablonu
function emptyWeek(){
  return {
    date:'',
    aktif:{
      fintech:[{l:'Wise',v:''},{l:'Mercury',v:''}],
      banka:[{l:'Garanti',v:''},{l:'KuveytTürk',v:''},{l:'Commerzbank',v:''}],
      odeme:[{l:'İyzico',v:''},{l:'Lidio',v:''},{l:'Stripe',v:''}],
      kargoAlacak:[{l:'Shipstation ABD',v:''},{l:'Amazon Shipping',v:''}],
    },
    pasif:{
      tedarikci:[{l:'Aspol US',v:''},{l:'Atölye LLC',v:''}],
      satici:[{l:'Mercury-Wise',v:''},{l:'Trendyol Cüzdan',v:''}],
      kargoBorc:[{l:'FedEx',v:''},{l:'Shipentegra',v:''}],
      maas:[{l:'Maaş+SGK+Vergi',v:''}],
    },
    vadeli:{
      platform:[{l:'İlker Ayan',v:''},{l:'Zehra Şahin',v:''}],
      proje:[{l:'Deloitte Fatura-7',v:''},{l:'Deloitte Fatura-8',v:''}],
      stok:[{l:'Trendyol Ayakkabı',v:''},{l:'Miqna Deco Halı',v:''}],
    },
    kararlar:[],
    notlar:''
  };
}

// SEED verileri (29 Nisan)
const SEED={id:1,date:'29 Nisan 2026',
  aktif:{
    fintech:[{l:'Wise',v:75170},{l:'Mercury',v:254444.84}],
    banka:[{l:'Garanti',v:36606.55},{l:'KuveytTürk',v:58254.45},{l:'Commerzbank',v:10000}],
    odeme:[{l:'İyzico',v:0},{l:'Lidio',v:0},{l:'Stripe',v:33942}],
    kargoAlacak:[{l:'Shipstation ABD',v:0},{l:'Amazon Shipping',v:0}],
  },
  pasif:{
    tedarikci:[{l:'Tedarikçi Cüzdan',v:315204}],
    satici:[{l:'Mercury-Wise',v:99450},{l:'Trendyol Cüzdan',v:11908}],
    kargoBorc:[{l:'Kargo-Ara Depo',v:60054.66}],
    maas:[{l:'Maaş+SGK+Vergi',v:115000}],
  },
  vadeli:{
    platform:[{l:'Platform Alacakları',v:18585.71}],
    proje:[{l:'Proje Gelirleri',v:44262.55}],
    stok:[{l:'Stok Gelirleri',v:3541}],
  },
  kararlar:[
    {icon:'⚖️',baslik:'Hukuki İşler',aciklama:'Mustafa Eren Tuna koordinatör atandı.',durum:'devam'},
    {icon:'🇺🇸',baslik:'Rexven LLC Beyanname',aciklama:'Beyanname hazırlanarak iletildi.',durum:'tamamlandi'},
    {icon:'💎',baslik:'Trendyol Takı',aciklama:'Her siparişte ~%20 zarar. Fiyat güncellemesi kararlaştırıldı.',durum:'aksiyon'},
    {icon:'📦',baslik:'Almanya Kargoları',aciklama:"1 Mayıs'tan Rexven GmbH üzerinden.",durum:'tamamlandi'},
    {icon:'💵',baslik:'C-Level Maaş',aciklama:"4.750 USD'ye sabitlendi.",durum:'tamamlandi'},
    {icon:'🔄',baslik:'Glozhen CSV',aciklama:"1 Mayıs'tan CSV sistemi devrede.",durum:'devam'},
    {icon:'📌',baslik:'Zanaart Borç',aciklama:"İş yükü karşılığı Zanaart'a borç kaydedilecek.",durum:'aksiyon'},
  ],
  notlar:''
};

const WEEK2={id:2,date:'7 Mayıs 2026',
  aktif:{
    fintech:[{l:'Wise',v:115113},{l:'Mercury',v:228954}],
    banka:[{l:'Garanti',v:14742.69},{l:'KuveytTürk',v:0},{l:'Commerzbank',v:0}],
    odeme:[{l:'İyzico',v:0},{l:'Lidio',v:420000},{l:'Stripe',v:21532.85}],
    kargoAlacak:[{l:'Shipstation ABD',v:2822},{l:'Amazon Shipping',v:12045},{l:'Nestshipper',v:4509.8}],
  },
  pasif:{
    tedarikci:[{l:'Tedarikçi Cüzdan',v:297428.53}],
    satici:[{l:'Mercury-Wise',v:115113},{l:'Trendyol Cüzdan',v:845076}],
    kargoBorc:[{l:'FedEx',v:283714},{l:'Shipentegra',v:6101.51},{l:'Aspol Ara Depo',v:1484}],
    maas:[{l:'Maaş+SGK+Vergi',v:28387.10}],
  },
  vadeli:{
    platform:[{l:'Platform Alacakları',v:22805.42}],
    proje:[{l:'Proje Gelirleri',v:44086.65}],
    stok:[{l:'Stok Gelirleri',v:3526.93}],
  },
  kararlar:[],
  notlar:''
};

// Hesaplama fonksiyonları
const aktifler=w=>{
  const a=w.aktif||{};
  const v=w.vadeli||{};
  return sum(a.fintech)+sum(a.banka)+sum(a.odeme)+sum(a.kargoAlacak)+sum(v.platform)+sum(v.proje)+sum(v.stok);
};
const pasifler=w=>{
  const p=w.pasif||{};
  return sum(p.tedarikci)+sum(p.satici)+sum(p.kargoBorc)+sum(p.maas);
};
const vadeliToplam=w=>{
  const v=w.vadeli||{};
  return sum(v.platform)+sum(v.proje)+sum(v.stok);
};
const ozkaynaklar=w=>aktifler(w)-pasifler(w);

// Supabase
const SUPA_URL='https://njdakcpptzvdihwtlgil.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qZGFrY3BwdHp2ZGlod3RsZ2lsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwOTAxNjEsImV4cCI6MjA5NjY2NjE2MX0.aBRRTOk5BZpopi0iETbX_tOnTC0GBuyYvi2_sYe78xU';

async function saveWeeks(){
  try{
    const res=await fetch(`${SUPA_URL}/rest/v1/weeks?id=eq.1`,{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}});
    const rows=await res.json();
    const method=rows.length>0?'PATCH':'POST';
    const url=rows.length>0?`${SUPA_URL}/rest/v1/weeks?id=eq.1`:`${SUPA_URL}/rest/v1/weeks`;
    await fetch(url,{method,headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(rows.length>0?{data:S.weeks}:{id:1,data:S.weeks})});
  }catch(e){console.error('save error',e);}
}

async function loadWeeks(){
  try{
    const res=await fetch(`${SUPA_URL}/rest/v1/weeks?id=eq.1&select=data`,{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}});
    const rows=await res.json();
    if(rows.length>0&&rows[0].data&&rows[0].data.length)return rows[0].data;
  }catch(e){}
  return null;
}

let S={
  weeks:[JSON.parse(JSON.stringify(SEED)),JSON.parse(JSON.stringify(WEEK2))],
  tab:'dashboard',sel:2,copied:false,
  draft:emptyWeek(),
  skf:false,nk:{icon:'📋',baslik:'',aciklama:'',durum:'devam'},
  ekfOpen:false,enk:{icon:'📋',baslik:'',aciklama:'',durum:'devam'},
  loading:true
};

const W=()=>S.weeks.find(w=>w.id===S.sel)||S.weeks[0];

// Dinamik satır yönetimi (taslak için)
function addDraftRow(section,sub){S.draft[section][sub].push({l:'',v:''});render();}
function delDraftRow(section,sub,i){S.draft[section][sub].splice(i,1);render();}
function updDraftRow(section,sub,i,field,val){
  const r=S.draft[section][sub][i];
  if(field==='v') r.v=parseFloat(val)||0; else r.l=val;
}

// Mevcut hafta satır yönetimi (dashboard için)
function addWeekRow(section,sub){const w=S.weeks.find(x=>x.id===S.sel);if(w){if(!w[section])w[section]={};if(!w[section][sub])w[section][sub]=[];w[section][sub].push({l:'',v:''});saveWeeks();render();}}
function delWeekRow(section,sub,i){const w=S.weeks.find(x=>x.id===S.sel);if(w&&w[section]&&w[section][sub]){w[section][sub].splice(i,1);saveWeeks();render();}}
function updWeekRow(section,sub,i,field,val){
  const w=S.weeks.find(x=>x.id===S.sel);
  if(w&&w[section]&&w[section][sub]&&w[section][sub][i]){
    if(field==='v') w[section][sub][i].v=parseFloat(val)||0; else w[section][sub][i].l=val;
    saveWeeks();
  }
}

function emailText(w){
  const ak=aktifler(w),pas=pasifler(w),oz=ozkaynaklar(w),vd=vadeliToplam(w);
  let t=`Selam ekip,\n\nBugünkü toplantıyı da kapattık. İşte özet:\n\nBİLANÇO ÖZET\nAktifler: ${fmt(ak)}\nPasifler: ${fmt(pas)}\nNet Kasa Bakiyesi: ${fmt(oz)}\nVadeli Alacaklar: ${fmt(vd)}\n`;
  t+=`\nAKTİFLER:\n• Fintech: ${fmt(sum(w.aktif?.fintech))}\n• Banka: ${fmt(sum(w.aktif?.banka))}\n• Ödeme Altyapıları: ${fmt(sum(w.aktif?.odeme))}\n• Kargo Bakiyeleri: ${fmt(sum(w.aktif?.kargoAlacak))}\n`;
  t+=`\nPASİFLER:\n• Tedarikçi Cüzdan: ${fmt(sum(w.pasif?.tedarikci))}\n• Satıcı Cüzdan: ${fmt(sum(w.pasif?.satici))}\n• Kargo Borçları: ${fmt(sum(w.pasif?.kargoBorc))}\n• Ay Bazlı Ödeme: ${fmt(sum(w.pasif?.maas))}\n`;
  if(w.kararlar?.length){t+='\nGÜNDEM & KARARLAR';w.kararlar.forEach(k=>{t+=`\n\n${k.icon} ${k.baslik}\n${k.aciklama}`;});}
  if(w.notlar)t+=`\n\nNOTLAR\n${w.notlar}`;
  t+='\n\nAklınıza takılan bir şey olursa yazın. Haftaya görüşmek üzere!\n\n[Adınız]';
  return t;
}

function renderDynRows(section,sub,color,isEdit,labelPlaceholder){
  const rows=isEdit?S.draft[section][sub]:((W()[section]||{})[sub]||[]);
  let h='';
  rows.forEach((r,i)=>{
    if(isEdit){
      h+=`<div class="drow-item">
        <input class="inp" style="font-size:13px;padding:7px 10px" placeholder="${labelPlaceholder}" value="${esc(r.l)}" oninput="updDraftRow('${section}','${sub}',${i},'l',this.value)">
        <input class="inp" type="number" step="0.01" style="font-size:13px;padding:7px 10px" placeholder="0.00" value="${r.v||''}" oninput="updDraftRow('${section}','${sub}',${i},'v',this.value)">
        <button class="mbtn del" onclick="delDraftRow('${section}','${sub}',${i})">✕</button>
      </div>`;
    } else {
      const bg=i%2===0?'var(--s2)':'transparent';
      h+=`<div class="row" style="background:${bg};justify-content:space-between">
        <div style="display:flex;align-items:center;gap:8px;flex:1">
          <input class="minp" style="flex:1;font-size:12px;padding:4px 8px;background:transparent;border:1px solid transparent" value="${esc(r.l)}" onchange="updWeekRow('${section}','${sub}',${i},'l',this.value)" placeholder="Kalem adı">
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <input class="minp" type="number" step="0.01" style="width:130px;font-size:12px;padding:4px 8px;text-align:right;color:${color}" value="${r.v||''}" onchange="updWeekRow('${section}','${sub}',${i},'v',this.value)">
          <button class="mbtn del" style="font-size:12px" onclick="delWeekRow('${section}','${sub}',${i})">✕</button>
        </div>
      </div>`;
    }
  });
  return h;
}

function render(){
  const w=W(),n=ozkaynaklar(w),neg=n<0,d=S.draft;
  let h=`<div class="hdr">
    <div style="display:flex;align-items:center;gap:12px">
      <div class="brand">REXVEN<span>Finans Takip</span></div>
      ${neg&&S.tab==='dashboard'?'<div class="warn">⚠️ Net Kasa Negatif</div>':''}
    </div>
    <select onchange="selW(parseInt(this.value))" style="background:var(--s2);border:1px solid var(--b1);border-radius:20px;padding:5px 16px;color:#93c5fd;font-size:13px;font-weight:700;font-family:inherit;outline:none;cursor:pointer">
      ${S.weeks.map(x=>`<option value="${x.id}"${x.id===S.sel?' selected':''}>${esc(x.date||'Hafta '+x.id)}</option>`).join('')}
    </select>
  </div>
  <div class="nav">`;
  [['dashboard','📊 Dashboard'],['email','✉️ Mail'],['gecmis','📅 Geçmiş'],['grafik','📈 Grafik'],['yeni','➕ Yeni Hafta']].forEach(([k,l])=>{
    h+=`<button class="${S.tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`;
  });
  h+=`</div>`;

  if(S.tab==='dashboard'){
    const ak=aktifler(w),pas=pasifler(w),vd=vadeliToplam(w);
    h+=`<div class="dash">`;
    h+=`<div class="kpis">`;
    [{l:'AKTİFLER',v:ak,c:'#3b82f6'},{l:'PASİFLER',v:pas,c:'#ef4444'},{l:'NET KASA BAKİYESİ',v:n,c:neg?'#ef4444':'#22c55e'}].forEach(({l,v,c})=>{
      h+=`<div class="kpi" style="background:${c}10;border-color:${c}30"><div class="kpi-bar" style="background:${c}"></div><div class="kpi-lbl">${l}</div><div class="kpi-v" style="color:${c}">${fmtK(v)}</div><div class="kpi-s">${fmt(v)}</div></div>`;
    });
    h+=`</div><div class="mgrid">`;

    // SOL: Aktifler
    h+=`<div class="card"><div class="ch"><span class="ch-title">🏦 AKTİFLER</span><button class="mbtn" style="font-size:11px" onclick="setTab('duzenle')">✏️ Düzenle</button></div><div class="rows">`;
    const aktifSections=[['fintech','Fintech (Wise+Mercury)'],['banka','Banka Hesapları'],['odeme','Ödeme Altyapıları'],['kargoAlacak','Kargo Bakiyeleri (Alacak)']];
    aktifSections.forEach(([sub,title])=>{
      const s=sum((w.aktif||{})[sub]);
      h+=`<div class="row" style="background:var(--b2);margin-bottom:1px"><span class="rl" style="font-weight:700;color:#93c5fd;font-size:11px">${title}</span><span class="rv" style="color:#93c5fd;font-size:12px">${fmt(s)}</span></div>`;
      ((w.aktif||{})[sub]||[]).forEach(r=>{
        if(r.l||r.v) h+=`<div class="row"><span class="rl" style="padding-left:12px;font-size:12px">↳ ${esc(r.l)}</span><span class="rv" style="font-size:12px">${fmt(r.v)}</span></div>`;
      });
    });
    // Vadeli alacaklar da aktife dahil
    const vadSections=[['platform','Platform Alacakları'],['proje','Proje Gelirleri'],['stok','Stok Gelirleri']];
    const vd=vadeliToplam(w);
    h+=`<div class="row" style="background:var(--b2);margin-bottom:1px"><span class="rl" style="font-weight:700;color:#f0b429;font-size:11px">Vadeli Alacaklar</span><span class="rv" style="color:#f0b429;font-size:12px">${fmt(vd)}</span></div>`;
    vadSections.forEach(([sub,title])=>{
      const s=sum((w.vadeli||{})[sub]);
      if(s) h+=`<div class="row"><span class="rl" style="padding-left:12px;font-size:12px">↳ ${title}</span><span class="rv" style="color:#f0b429;font-size:12px">${fmt(s)}</span></div>`;
    });
    h+=`</div><div class="tot-bar" style="background:#3b82f610;border-top-color:#3b82f630"><span class="tot-lbl" style="color:#93c5fd">TOPLAM AKTİFLER</span><span class="tot-v" style="color:#3b82f6">${fmt(ak)}</span></div></div>`;

    // ORTA: Pasifler
    h+=`<div class="card"><div class="ch"><span class="ch-title">📤 PASİFLER</span></div><div class="rows">`;
    const pasifSections=[['tedarikci','Tedarikçi Cüzdan (Borç)'],['satici','Satıcı Cüzdan (Avans)'],['kargoBorc','Kargo-Ara Depo (Borç)'],['maas','Ay Bazlı Ödeme']];
    pasifSections.forEach(([sub,title])=>{
      const s=sum((w.pasif||{})[sub]);
      h+=`<div class="row" style="background:var(--b2);margin-bottom:1px"><span class="rl" style="font-weight:700;color:#fca5a5;font-size:11px">${title}</span><span class="rv" style="color:#fca5a5;font-size:12px">${fmt(s)}</span></div>`;
      ((w.pasif||{})[sub]||[]).forEach(r=>{
        if(r.l||r.v) h+=`<div class="row"><span class="rl" style="padding-left:12px;font-size:12px">↳ ${esc(r.l)}</span><span class="rv" style="color:#fca5a5;font-size:12px">${fmt(r.v)}</span></div>`;
      });
    });
    h+=`</div><div class="tot-bar" style="background:#ef444410;border-top-color:#ef444430"><span class="tot-lbl" style="color:#fca5a5">TOPLAM PASİFLER</span><span class="tot-v" style="color:#ef4444">${fmt(pas)}</span></div></div>`;

    // SAĞ: Kararlar
    h+=`<div class="col-right">`;

    // Kararlar
    h+=`<div class="card" style="flex:1"><div class="ch"><span class="ch-title">📋 Kararlar</span><button class="mbtn" onclick="ekf()">+ Ekle</button></div>`;
    h+=`<div class="mform${S.ekfOpen?' open':''}">
      <div class="mform-row"><input class="minp" style="width:44px;flex:none" id="ekfIcon" value="${esc(S.enk.icon)}" oninput="uenk('icon',this.value)"><input class="minp" id="ekfBaslik" placeholder="Başlık" value="${esc(S.enk.baslik)}" oninput="uenk('baslik',this.value)"></div>
      <div class="mform-row"><input class="minp" id="ekfAcik" placeholder="Açıklama..." value="${esc(S.enk.aciklama)}" oninput="uenk('aciklama',this.value)"></div>
      <div class="mform-row">
        <select class="msel" onchange="uenk('durum',this.value)"><option value="devam"${S.enk.durum==='devam'?' selected':''}>🔄 Devam</option><option value="tamamlandi"${S.enk.durum==='tamamlandi'?' selected':''}>✅ Tamam</option><option value="aksiyon"${S.enk.durum==='aksiyon'?' selected':''}>⚡ Aksiyon</option></select>
        <button class="mbtn ok" onclick="aek()">Ekle ✓</button>
      </div></div>`;
    h+=`<div class="rows">`;
    if(!w.kararlar?.length) h+=`<div style="font-size:12px;color:var(--t3);padding:6px">Henüz karar girilmemiş.</div>`;
    (w.kararlar||[]).forEach((k,i)=>{
      h+=`<div class="krow"><span class="kicon">${esc(k.icon)}</span><div class="ktext"><div class="kbaslik">${esc(k.baslik)}</div><div class="kacik">${esc(k.aciklama)}</div></div>
        <select class="msel" style="width:90px;flex:none;font-size:10px;padding:3px 5px" onchange="ukd(${i},this.value)">
          <option value="devam"${k.durum==='devam'?' selected':''}>🔄 Devam</option>
          <option value="tamamlandi"${k.durum==='tamamlandi'?' selected':''}>✅ Tamam</option>
          <option value="aksiyon"${k.durum==='aksiyon'?' selected':''}>⚡ Aksiyon</option>
        </select></div>`;
    });
    h+=`</div></div></div></div></div>`;
  }

  else if(S.tab==='duzenle'){
    // Mevcut haftayı düzenle — dinamik satırlarla
    h+=`<div class="scroll-tab"><div style="max-width:960px">
      <div style="font-size:17px;font-weight:700;color:var(--gold);margin-bottom:16px">✏️ ${esc(w.date)} — Düzenle</div>`;
    
    const sections=[
      {title:'🏦 AKTİFLER',color:'#93c5fd',groups:[
        {section:'aktif',sub:'fintech',label:'Fintech (Wise + Mercury)',ph:'örn: Wise'},
        {section:'aktif',sub:'banka',label:'Banka Hesapları',ph:'örn: Garanti'},
        {section:'aktif',sub:'odeme',label:'Ödeme Altyapıları',ph:'örn: İyzico'},
        {section:'aktif',sub:'kargoAlacak',label:'Kargo Bakiyeleri (Alacak)',ph:'örn: Amazon Shipping'},
      ]},
      {title:'📤 PASİFLER',color:'#fca5a5',groups:[
        {section:'pasif',sub:'tedarikci',label:'Tedarikçi Cüzdan',ph:'örn: Aspol US'},
        {section:'pasif',sub:'satici',label:'Satıcı Cüzdan (Müşteri Avansları)',ph:'örn: Trendyol Cüzdan'},
        {section:'pasif',sub:'kargoBorc',label:'Kargo-Ara Depo (Borç)',ph:'örn: FedEx'},
        {section:'pasif',sub:'maas',label:'Ay Bazlı Ödeme',ph:'örn: Maaş+SGK'},
      ]},
      {title:'📈 VADELİ ALACAKLAR',color:'#f0b429',groups:[
        {section:'vadeli',sub:'platform',label:'Platform Alacakları',ph:'örn: İlker Ayan'},
        {section:'vadeli',sub:'proje',label:'Proje Gelirleri',ph:'örn: Deloitte'},
        {section:'vadeli',sub:'stok',label:'Stok Gelirleri',ph:'örn: Trendyol Ayakkabı'},
      ]},
    ];

    sections.forEach(({title,color,groups})=>{
      h+=`<div class="scard">
        <div class="sch" style="color:${color}">${title}</div>`;
      groups.forEach(({section,sub,label,ph})=>{
        const rows=(w[section]||{})[sub]||[];
        const total=sum(rows);
        h+=`<div class="drow-sec"><span style="color:${color}">${label}</span>
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:12px;color:${color};font-weight:700">${fmt(total)}</span>
            <button class="mbtn" onclick="addWeekRow('${section}','${sub}')">+ Satır</button>
          </div></div>`;
        rows.forEach((r,i)=>{
          h+=`<div class="drow-item">
            <input class="inp" style="font-size:13px;padding:7px 10px" placeholder="${ph}" value="${esc(r.l)}" onchange="updWeekRow('${section}','${sub}',${i},'l',this.value)">
            <input class="inp" type="number" step="0.01" style="font-size:13px;padding:7px 10px" placeholder="0.00" value="${r.v||''}" onchange="updWeekRow('${section}','${sub}',${i},'v',this.value)">
            <button class="mbtn del" onclick="delWeekRow('${section}','${sub}',${i})">✕</button>
          </div>`;
        });
      });
      h+=`</div>`;
    });
    h+=`<button class="savebtn" onclick="setTab('dashboard')" style="background:var(--b1);color:#93c5fd">← Dashboard'a Dön</button>
    </div></div>`;
  }

  else if(S.tab==='email'){
    h+=`<div class="scroll-tab"><div style="max-width:720px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <div style="font-size:17px;font-weight:700;color:var(--gold)">${esc(w.date)} — Mail Özeti</div>
        <button class="copybtn" onclick="copyEmail()">${S.copied?'✅ Kopyalandı':'📋 Kopyala'}</button>
      </div>
      <div class="epre">${esc(emailText(w))}</div>
    </div></div>`;
  }

  else if(S.tab==='gecmis'){
    h+=`<div class="scroll-tab"><div style="max-width:800px">
      <div style="font-size:17px;font-weight:700;color:var(--gold);margin-bottom:14px">📅 Tüm Haftalar</div>`;
    [...S.weeks].reverse().forEach(x=>{
      const n=ozkaynaklar(x),a=x.id===S.sel;
      h+=`<div class="hcard${a?' on':''}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">
          <div style="flex:1;cursor:pointer" onclick="selW(${x.id});setTab('dashboard')">
            <div style="font-size:15px;font-weight:700;color:${a?'#93c5fd':'var(--t1)'};margin-bottom:8px">${esc(x.date||'Hafta '+x.id)}</div>
            <div style="display:flex;gap:16px;font-size:13px;flex-wrap:wrap">
              <span style="color:var(--t3)">Aktif: <strong style="color:#3b82f6">${fmtK(aktifler(x))}</strong></span>
              <span style="color:var(--t3)">Pasif: <strong style="color:#ef4444">${fmtK(pasifler(x))}</strong></span>
              <span style="color:var(--t3)">Net: <strong style="color:${n<0?'#ef4444':'#22c55e'}">${fmtK(n)}</strong></span>
            </div>
          </div>
          <button class="mbtn del" onclick="deleteWeek(${x.id})" style="border:1px solid #7f1d1d;color:#fca5a5;padding:6px 12px;font-size:12px">🗑 Sil</button>
        </div>
      </div>`;
    });
    h+=`</div></div>`;
  }

  else if(S.tab==='grafik'){
    h+=`<div class="scroll-tab">
      <div style="font-size:17px;font-weight:700;color:var(--gold);margin-bottom:16px">📈 Haftalık Karşılaştırma</div>
      <div style="background:var(--s1);border:1px solid var(--b2);border-radius:14px;padding:20px;margin-bottom:16px">
        <canvas id="chartMain"></canvas>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px">
        ${S.weeks.map(x=>{const n=ozkaynaklar(x);return`<div style="background:var(--s1);border:1px solid var(--b2);border-radius:12px;padding:14px">
          <div style="font-size:13px;font-weight:700;color:var(--gold);margin-bottom:10px">${esc(x.date)}</div>
          <div style="font-size:12px;color:var(--t3);margin-bottom:4px">Aktif: <span style="color:#3b82f6;font-weight:700">${fmtK(aktifler(x))}</span></div>
          <div style="font-size:12px;color:var(--t3);margin-bottom:4px">Pasif: <span style="color:#ef4444;font-weight:700">${fmtK(pasifler(x))}</span></div>
          <div style="font-size:12px;color:var(--t3)">Net: <span style="color:${n<0?'#ef4444':'#22c55e'};font-weight:700">${fmtK(n)}</span></div>
        </div>`;}).join('')}
      </div>
    </div>`;
  }

  else if(S.tab==='yeni'){
    h+=`<div class="scroll-tab"><div style="max-width:960px">
      <div style="font-size:17px;font-weight:700;color:var(--gold);margin-bottom:16px">➕ Yeni Hafta Ekle</div>
      <div class="scard"><div class="sch">📅 Toplantı Tarihi</div>
        <input class="inp" placeholder="örn: 14 Mayıs 2026" value="${esc(d.date)}" oninput="S.draft.date=this.value">
      </div>`;

    const newSections=[
      {title:'🏦 AKTİFLER',color:'#93c5fd',groups:[
        {section:'aktif',sub:'fintech',label:'Fintech (Wise + Mercury)',ph:'örn: Wise'},
        {section:'aktif',sub:'banka',label:'Banka Hesapları',ph:'örn: Garanti'},
        {section:'aktif',sub:'odeme',label:'Ödeme Altyapıları',ph:'örn: İyzico'},
        {section:'aktif',sub:'kargoAlacak',label:'Kargo Bakiyeleri (Alacak)',ph:'örn: Amazon Shipping'},
      ]},
      {title:'📤 PASİFLER',color:'#fca5a5',groups:[
        {section:'pasif',sub:'tedarikci',label:'Tedarikçi Cüzdan',ph:'örn: Aspol US'},
        {section:'pasif',sub:'satici',label:'Satıcı Cüzdan (Avanslar)',ph:'örn: Trendyol Cüzdan'},
        {section:'pasif',sub:'kargoBorc',label:'Kargo-Ara Depo (Borç)',ph:'örn: FedEx'},
        {section:'pasif',sub:'maas',label:'Ay Bazlı Ödeme',ph:'örn: Maaş+SGK'},
      ]},
      {title:'📈 VADELİ ALACAKLAR',color:'#f0b429',groups:[
        {section:'vadeli',sub:'platform',label:'Platform Alacakları',ph:'örn: İlker Ayan'},
        {section:'vadeli',sub:'proje',label:'Proje Gelirleri',ph:'örn: Deloitte'},
        {section:'vadeli',sub:'stok',label:'Stok Gelirleri',ph:'örn: Trendyol Ayakkabı'},
      ]},
    ];

    newSections.forEach(({title,color,groups})=>{
      h+=`<div class="scard"><div class="sch" style="color:${color}">${title}</div>`;
      groups.forEach(({section,sub,label,ph})=>{
        const rows=d[section][sub];
        const total=sum(rows);
        h+=`<div class="drow-sec"><span>${label}</span>
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:12px;color:${color};font-weight:700">${fmt(total)}</span>
            <button class="mbtn" onclick="addDraftRow('${section}','${sub}')">+ Satır</button>
          </div></div>`;
        rows.forEach((r,i)=>{
          h+=`<div class="drow-item">
            <input class="inp" style="font-size:13px;padding:7px 10px" placeholder="${ph}" value="${esc(r.l)}" oninput="updDraftRow('${section}','${sub}',${i},'l',this.value)">
            <input class="inp" type="number" step="0.01" style="font-size:13px;padding:7px 10px" placeholder="0.00" value="${r.v||''}" oninput="updDraftRow('${section}','${sub}',${i},'v',this.value)">
            <button class="mbtn del" onclick="delDraftRow('${section}','${sub}',${i})">✕</button>
          </div>`;
        });
      });
      h+=`</div>`;
    });

    h+=`<div class="scard"><div class="sch"><span>📋 Kararlar</span><button class="mbtn" onclick="S.skf=!S.skf;render()">+ Ekle</button></div>
      <div class="mform${S.skf?' open':''}">
        <div class="mform-row"><input class="minp" style="width:44px;flex:none" value="${esc(S.nk.icon)}" oninput="S.nk.icon=this.value"><input class="minp" placeholder="Başlık" value="${esc(S.nk.baslik)}" oninput="S.nk.baslik=this.value"></div>
        <div class="mform-row"><input class="minp" placeholder="Açıklama..." value="${esc(S.nk.aciklama)}" oninput="S.nk.aciklama=this.value"></div>
        <div class="mform-row">
          <select class="msel" onchange="S.nk.durum=this.value"><option value="devam">🔄 Devam</option><option value="tamamlandi">✅ Tamam</option><option value="aksiyon">⚡ Aksiyon</option></select>
          <button class="mbtn ok" onclick="ak()">Ekle ✓</button>
        </div></div>
      ${d.kararlar.map((k,i)=>`<div class="krow"><span class="kicon">${esc(k.icon)}</span><div class="ktext"><div class="kbaslik">${esc(k.baslik)}</div><div class="kacik">${esc(k.aciklama)}</div></div><button class="mbtn del" onclick="S.draft.kararlar.splice(${i},1);render()">✕</button></div>`).join('')}
    </div>
    <button class="savebtn" onclick="sw()" style="opacity:${d.date?1:0.5}">✅ Haftayı Kaydet</button>
    </div></div>`;
  }

  h+=`</div>`;
  document.getElementById('app').innerHTML=h;
}

let chartInstance=null;
function drawChart(){
  const c=document.getElementById('chartMain');
  if(!c)return;
  if(chartInstance){chartInstance.destroy();chartInstance=null;}
  chartInstance=new Chart(c,{
    type:'bar',
    data:{
      labels:S.weeks.map(x=>x.date||'Hafta '+x.id),
      datasets:[
        {label:'Aktifler',data:S.weeks.map(x=>aktifler(x)),backgroundColor:'rgba(59,130,246,0.7)',borderColor:'#3b82f6',borderWidth:2,borderRadius:6},
        {label:'Pasifler',data:S.weeks.map(x=>pasifler(x)),backgroundColor:'rgba(239,68,68,0.7)',borderColor:'#ef4444',borderWidth:2,borderRadius:6},
        {label:'Net Kasa',data:S.weeks.map(x=>ozkaynaklar(x)),backgroundColor:S.weeks.map(x=>ozkaynaklar(x)<0?'rgba(239,68,68,0.5)':'rgba(34,197,94,0.7)'),borderColor:S.weeks.map(x=>ozkaynaklar(x)<0?'#ef4444':'#22c55e'),borderWidth:2,borderRadius:6},
      ]
    },
    options:{responsive:true,plugins:{legend:{labels:{color:'#94a3b8',font:{size:13}}},tooltip:{callbacks:{label:ctx=>' '+fmt(ctx.raw)}}},scales:{x:{ticks:{color:'#94a3b8'},grid:{color:'#1a2e4a'}},y:{ticks:{color:'#94a3b8',callback:v=>'$'+(Math.abs(v)>=1000?(v/1000).toFixed(0)+'K':v)},grid:{color:'#1a2e4a'}}}}
  });
}

function setTab(t){S.tab=t;render();if(t==='grafik')setTimeout(drawChart,100);}
function selW(id){S.sel=id;render();}
function deleteWeek(id){
  if(S.weeks.length<=1){alert('En az bir hafta olmalı!');return;}
  if(!confirm('Bu haftayı silmek istediğinize emin misiniz?'))return;
  S.weeks=S.weeks.filter(w=>w.id!==id);
  if(S.sel===id)S.sel=S.weeks[S.weeks.length-1].id;
  saveWeeks();render();
}
function ekf(){S.ekfOpen=!S.ekfOpen;render();}
function uenk(k,v){S.enk[k]=v;}
function aek(){
  const icon=document.getElementById('ekfIcon')?.value||S.enk.icon;
  const baslik=document.getElementById('ekfBaslik')?.value||S.enk.baslik;
  const acik=document.getElementById('ekfAcik')?.value||S.enk.aciklama;
  if(!baslik)return;
  const w=S.weeks.find(x=>x.id===S.sel);
  if(w){if(!w.kararlar)w.kararlar=[];w.kararlar.push({icon,baslik,aciklama:acik,durum:S.enk.durum});saveWeeks();}
  S.enk={icon:'📋',baslik:'',aciklama:'',durum:'devam'};S.ekfOpen=false;render();
}
function ukd(i,durum){
  const w=S.weeks.find(x=>x.id===S.sel);
  if(w&&w.kararlar?.[i]){w.kararlar[i].durum=durum;saveWeeks();}render();
}
function ak(){
  if(!S.nk.baslik)return;
  S.draft.kararlar.push({...S.nk});
  S.nk={icon:'📋',baslik:'',aciklama:'',durum:'devam'};S.skf=false;render();
}
function sw(){
  if(!S.draft.date)return;
  const id=Math.max(...S.weeks.map(w=>w.id),0)+1;
  S.weeks.push({...JSON.parse(JSON.stringify(S.draft)),id});
  S.sel=id;S.draft=emptyWeek();S.tab='dashboard';saveWeeks();render();
}
function copyEmail(){
  navigator.clipboard.writeText(emailText(W())).then(()=>{S.copied=true;render();setTimeout(()=>{S.copied=false;render();},2500);});
}

(async()=>{
  document.getElementById('app').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#07101f;color:#94a3b8;font-size:16px;font-family:Segoe UI,sans-serif">⏳ Veriler yükleniyor...</div>';
  const data=await loadWeeks();
  if(data&&data.length)S.weeks=data;
  S.sel=S.weeks[S.weeks.length-1].id;
  S.loading=false;
  render();
})();
</script>
</body>
</html>
