<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<title>Rexven | Finans Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#07101f;color:#e2e8f0}
:root{
  --bg:#07101f;--s1:#0d1e35;--s2:#0a1628;--s3:#061221;
  --b1:#1e3a5f;--b2:#162d4a;
  --t1:#e2e8f0;--t2:#94a3b8;--t3:#475569;
  --blue:#3b82f6;--green:#22c55e;--red:#ef4444;--gold:#f0b429;--amber:#f59e0b;
}
#app{display:flex;flex-direction:column;height:100vh}

/* HEADER */
.hdr{background:linear-gradient(135deg,#0a1628 0%,#0d1e35 100%);border-bottom:1px solid var(--b1);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:16px}
.brand{font-size:18px;font-weight:900;color:var(--gold);letter-spacing:-0.5px}
.brand span{font-size:10px;font-weight:500;color:var(--t3);letter-spacing:3px;text-transform:uppercase;margin-left:8px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:4px 14px;border-radius:20px;border:1px solid var(--b2);background:transparent;color:var(--t3);cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;transition:all .15s}
.pill.on{background:var(--b1);color:#93c5fd;border-color:var(--blue)}

/* NAV */
.nav{display:flex;padding:0 24px;background:var(--s2);border-bottom:1px solid var(--b2);flex-shrink:0}
.nav button{padding:10px 16px;border:none;background:none;color:var(--t3);font-weight:600;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:inherit;transition:all .15s}
.nav button.on{color:var(--gold);border-bottom:2px solid var(--gold)}

/* DASHBOARD LAYOUT */
.dash{flex:1;display:grid;grid-template-rows:auto 1fr;gap:10px;padding:12px 20px;overflow:hidden;min-height:0}

/* KPI ROW */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{border-radius:12px;padding:14px 16px;position:relative;overflow:hidden;border:1px solid}
.kpi-bar{position:absolute;top:0;left:0;right:0;height:3px}
.kpi-lbl{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.kpi-v{font-size:22px;font-weight:800;letter-spacing:-1px;line-height:1}
.kpi-s{font-size:11px;color:var(--t3);margin-top:4px}

/* MAIN GRID — 3 eşit sütun */
.mgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;min-height:0;overflow:hidden}

/* SOL 2 sütun = gelir/gider, SAĞ 1 sütun = kararlar+personel */
.col-left{display:grid;grid-template-rows:1fr 1fr;gap:10px;min-height:0}
.col-mid{display:flex;flex-direction:column;gap:10px;min-height:0}
.col-right{display:flex;flex-direction:column;gap:10px;min-height:0}

/* KART */
.card{background:var(--s1);border:1px solid var(--b2);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ch{padding:10px 14px 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ch-title{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase}
.rows{flex:1;overflow-y:auto;padding:6px 8px}
.row{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;border-radius:6px;margin-bottom:2px;font-size:12px}
.row:nth-child(odd){background:var(--s2)}
.rl{color:var(--t2)}
.rv{font-weight:600;color:var(--t1)}
.tot-bar{padding:8px 14px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--b2);flex-shrink:0}
.tot-lbl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.tot-v{font-size:14px;font-weight:800}

/* BADGE */
.bdg{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid}

/* KARAR SATIRI */
.krow{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:8px;margin-bottom:4px;background:var(--s2);border:1px solid var(--b2);font-size:12px}
.kicon{font-size:14px;flex-shrink:0;margin-top:1px}
.ktext{flex:1;min-width:0}
.kbaslik{font-weight:600;color:var(--t1);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kacik{color:var(--t3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* MINI FORM */
.mform{padding:8px 10px;border-bottom:1px solid var(--b2);background:var(--s3);flex-shrink:0;display:none}
.mform.open{display:block}
.mform-row{display:flex;gap:6px;margin-bottom:6px}
.minp{flex:1;background:var(--s2);border:1px solid var(--b2);border-radius:6px;padding:6px 9px;color:var(--t1);font-size:12px;outline:none;font-family:inherit}
.minp:focus{border-color:var(--blue)}
.msel{flex:1;background:var(--s2);border:1px solid var(--b2);border-radius:6px;padding:6px 9px;color:var(--t1);font-size:12px;outline:none;font-family:inherit}
.msel option{background:var(--s1)}
.mbtn{padding:5px 12px;border-radius:6px;border:1px solid var(--b1);background:var(--s1);color:#93c5fd;cursor:pointer;font-size:11px;font-weight:700;font-family:inherit;white-space:nowrap}
.mbtn.ok{background:#052e16;color:#86efac;border-color:#16a34a}
.mbtn.del{background:none;border:none;color:var(--red);cursor:pointer;font-size:13px}

/* WARN */
.warn{background:#3b000030;border:1px solid #7f1d1d;border-radius:8px;padding:5px 12px;color:#fca5a5;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:6px}

/* SCROLL TABS */
.scroll-tab{flex:1;overflow-y:auto;padding:20px 24px}

/* INPUTS */
.inp{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:8px;padding:9px 12px;color:var(--t1);font-size:13px;outline:none;font-family:inherit}
.inp:focus{border-color:var(--blue)}
.lbl{font-size:11px;font-weight:600;color:var(--t3);margin-bottom:4px;display:block}
.scard{background:var(--s1);border:1px solid var(--b2);border-radius:12px;padding:16px;margin-bottom:12px}
.sch{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.fsec{font-size:11px;font-weight:700;color:var(--blue);margin:12px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--b2)}
.savebtn{width:100%;padding:13px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--gold),#d97706);color:#07101f;cursor:pointer;font-weight:800;font-size:15px;font-family:inherit;margin-top:8px}
.copybtn{padding:8px 16px;border-radius:8px;border:1px solid var(--b1);background:transparent;color:#93c5fd;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit}
.epre{background:var(--s1);border:1px solid var(--b2);border-radius:12px;padding:20px;font-family:'Courier New',monospace;font-size:12px;line-height:1.8;color:var(--t2);white-space:pre-wrap;word-break:break-word;margin-top:14px}
.drop{border:2px dashed var(--b1);border-radius:12px;padding:28px;text-align:center;cursor:pointer;transition:background .2s}
.drop:hover,.drop.over{background:var(--s2)}
.ai-ok{background:#052e16;color:#86efac;border:1px solid #16a34a;border-radius:8px;padding:9px 13px;font-size:12px;display:none;align-items:center;gap:8px;margin-top:8px}
.ai-ok.on{display:flex}
.ai-err{background:#3b0000;color:#fca5a5;border:1px solid #dc2626;border-radius:8px;padding:9px 13px;font-size:12px;display:none;align-items:center;gap:8px;margin-top:8px}
.ai-err.on{display:flex}
.ai-load{background:#0c1a2e;color:#93c5fd;border:1px solid var(--blue);border-radius:8px;padding:9px 13px;font-size:12px;display:none;align-items:center;gap:8px;margin-top:8px}
.ai-load.on{display:flex}
.hcard{background:var(--s1);border:1px solid var(--b2);border-radius:12px;padding:14px 18px;cursor:pointer;margin-bottom:8px;transition:border-color .15s}
.hcard:hover,.hcard.on{border-color:var(--blue)}
</style>

async function parseImg(b64,mt){
  const sys=`Finans tablosu okuma uzmanısın. SADECE JSON döndür:\n{"tarihTahmini":"","financial":{"aktifler":0,"pasifler":0,"tasarruf":0,"fintechHesaplar":0,"bankaHesaplari":0,"odemeAltyapilari":0,"tedarikciCuzdan":0,"saticiCuzdan":0,"kargoDepo":0,"ayBazliOdeme":0,"platformAlacak":0,"projeGeliri":0,"stokGeliri":0,"vadeliAlacaklar":0}}\nAKTİFLER->aktifler,PASİFLER->pasifler,TASARRUF->tasarruf,FİNTECH->fintechHesaplar,BANKA->bankaHesaplari,ÖDEME ALTYAPI->odemeAltyapilari,TEDARİKÇİ CÜZDAN toplamı->tedarikciCuzdan,SATICI CÜZDAN->saticiCuzdan,KARGO-ARA DEPO->kargoDepo,AY BAZLI ÖDEME->ayBazliOdeme,PLATFORM->platformAlacak,PROJE->projeGeliri,STOK->stokGeliri,VADELİ->vadeliAlacaklar. Sembol kaldır, sadece sayı.`;
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:sys,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:mt,data:b64}},{type:'text',text:'JSON olarak çıkar.'}]}]})});
  const d=await r.json();
  if(d.error)throw new Error(d.error.message);
  const txt=d.content?.find(b=>b.type==='text')?.text||'{}';
  return JSON.parse(txt.replace(/```json|```/g,'').trim());
}

function saveNotlar(v){
  const w=S.weeks.find(x=>x.id===S.sel);
  if(w){w.notlar=v;saveWeeks();}
}
function setTab(t){S.tab=t;render();if(t==='grafik')setTimeout(drawChart,100);}
function deleteWeek(id){
  if(S.weeks.length<=1){alert('En az bir hafta olmalı!');return;}
  if(!confirm('Bu haftayı silmek istediğinize emin misiniz?'))return;
  S.weeks=S.weeks.filter(w=>w.id!==id);
  if(S.sel===id) S.sel=S.weeks[S.weeks.length-1].id;
  saveWeeks();render();
}
function selW(id){S.sel=id;render();}
function ud(k,v){S.draft[k]=v;}
function uf(k,v){S.draft.f[k]=parseFloat(v)||0;}
function unk(k,v){S.nk[k]=v;}
function unp(k,v){S.np[k]=v;}
function uenk(k,v){S.enk[k]=v;}
function uenp(k,v){S.enp[k]=v;}
function skf(){S.skf=!S.skf;render();}
function spf(){S.spf=!S.spf;render();}
function addExtraRow(type){
  if(type==='gelir') S.draft.extraGelir=[...(S.draft.extraGelir||[]),{label:'',value:''}];
  else S.draft.extraGider=[...(S.draft.extraGider||[]),{label:'',value:''}];
  render();
}
function updateExtra(type,i,field,val){
  const arr=type==='gelir'?S.draft.extraGelir:S.draft.extraGider;
  if(arr[i]) arr[i][field]=field==='value'?parseFloat(val)||0:val;
}
function removeExtra(type,i){
  if(type==='gelir') S.draft.extraGelir.splice(i,1);
  else S.draft.extraGider.splice(i,1);
  render();
}
function ekf(){S.ekfOpen=!S.ekfOpen;render();}
function epf(){S.epfOpen=!S.epfOpen;render();}
function ak(){if(!S.nk.baslik)return;S.draft.kararlar.push({...S.nk});S.nk={icon:'📋',baslik:'',aciklama:'',durum:'devam'};S.skf=false;render();}
function ap(){if(!S.np.isim)return;S.draft.personel.push({...S.np});S.np={isim:'',durum:'istifa'};S.spf=false;render();}
function rk(i){S.draft.kararlar.splice(i,1);render();}
function rp(i){S.draft.personel.splice(i,1);render();}
function aek(){
  const icon=document.getElementById('ekfIcon')?.value||S.enk.icon;
  const baslik=document.getElementById('ekfBaslik')?.value||S.enk.baslik;
  const acik=document.getElementById('ekfAcik')?.value||S.enk.aciklama;
  if(!baslik)return;
  const w=S.weeks.find(x=>x.id===S.sel);
  if(w){
    w.kararlar.push({icon,baslik,aciklama:acik,durum:S.enk.durum});
    try{localStorage.setItem('rexven_weeks',JSON.stringify(S.weeks));}catch(e){}
  }
  S.enk={icon:'📋',baslik:'',aciklama:'',durum:'devam'};S.ekfOpen=false;saveWeeks();render();
}
function aep(){
  const isim=document.getElementById('epfIsim')?.value||S.enp.isim;
  if(!isim)return;
  const w=S.weeks.find(x=>x.id===S.sel);
  if(w)w.personel.push({isim,durum:S.enp.durum});
  S.enp={isim:'',durum:'istifa'};S.epfOpen=false;saveWeeks();render();
}
function ewk(i){const w=S.weeks.find(x=>x.id===S.sel);if(w)w.kararlar.splice(i,1);saveWeeks();render();}
function ewp(i){const w=S.weeks.find(x=>x.id===S.sel);if(w)w.personel.splice(i,1);saveWeeks();render();}
function ukd(i,durum){
  const w=S.weeks.find(x=>x.id===S.sel);
  if(w&&w.kararlar[i]){
    w.kararlar[i].durum=durum;
    saveWeeks();
  }
  render();
}
function copyEmail(){
  navigator.clipboard.writeText(emailText(W())).then(()=>{S.copied=true;render();setTimeout(()=>{S.copied=false;render();},2500);});
}
function sw(){
  const d=S.draft;
  document.querySelectorAll('.inp').forEach(el=>{
    const oi=el.getAttribute('oninput');
    if(oi&&oi.includes("ud('date'"))d.date=el.value;
    if(oi&&oi.includes("ud('notlar'"))d.notlar=el.value;
    if(oi&&oi.includes("uf('")){const k=oi.match(/uf\('([^']+)'/)?.[1];if(k)d.f[k]=parseFloat(el.value)||0;}
  });
  if(!d.date)return;
  const id=Math.max(...S.weeks.map(w=>w.id),0)+1;
  S.weeks.push({...JSON.parse(JSON.stringify(d)),id,extraGelir:d.extraGelir||[],extraGider:d.extraGider||[]});
  S.sel=id;S.draft={date:'',f:{...EF},kararlar:[],personel:[],notlar:'',extraGelir:[],extraGider:[]};
  S.prev=null;S.ai='idle';S.aimsg='';S.tab='dashboard';saveWeeks();render();
}
function dzo(e){e.preventDefault();document.getElementById('dz')?.classList.add('over');}
function dzl(){document.getElementById('dz')?.classList.remove('over');}
function dzd(e){e.preventDefault();dzl();const f=e.dataTransfer.files[0];if(f)hf(f);}
function hf(file){
  if(!file||!file.type.startsWith('image/'))return;
  S.ai='loading';S.aimsg='AI tabloyu analiz ediyor...';render();
  const r=new FileReader();
  r.onload=async(e)=>{
    const url=e.target.result;S.prev=url;render();
    const b64=url.split(',')[1];
    try{
      const res=await parseImg(b64,file.type);
      S.draft.f={...S.draft.f,...res.financial};
      if(res.tarihTahmini)S.draft.date=res.tarihTahmini;
      S.ai='done';S.aimsg='Tablo okundu! Verileri kontrol edip onaylayın.';render();
    }catch(err){S.ai='error';S.aimsg='Hata: '+err.message;render();}
  };
  r.readAsDataURL(file);
}
let chartInstance=null;
function drawChart(){
  const canvas=document.getElementById('chartMain');
  if(!canvas)return;
  if(chartInstance){chartInstance.destroy();chartInstance=null;}
  const labels=S.weeks.map(x=>x.date||'Hafta '+x.id);
  chartInstance=new Chart(canvas,{
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'Aktifler',data:S.weeks.map(x=>aktifler(x)),backgroundColor:'rgba(59,130,246,0.7)',borderColor:'#3b82f6',borderWidth:2,borderRadius:6},
        {label:'Pasifler',data:S.weeks.map(x=>pasifler(x)),backgroundColor:'rgba(239,68,68,0.7)',borderColor:'#ef4444',borderWidth:2,borderRadius:6},
        {label:'Net Kasa',data:S.weeks.map(x=>ozkaynaklar(x)),backgroundColor:S.weeks.map(x=>ozkaynaklar(x)<0?'rgba(239,68,68,0.5)':'rgba(34,197,94,0.7)'),borderColor:S.weeks.map(x=>ozkaynaklar(x)<0?'#ef4444':'#22c55e'),borderWidth:2,borderRadius:6,type:'bar'},
      ]
    },
    options:{
      responsive:true,
      maintainAspectRatio:true,
      plugins:{
        legend:{labels:{color:'#94a3b8',font:{size:13}}},
        tooltip:{callbacks:{label:ctx=>' '+new Intl.NumberFormat('tr-TR',{style:'currency',currency:'USD',minimumFractionDigits:0}).format(ctx.raw)}}
      },
      scales:{
        x:{ticks:{color:'#94a3b8',font:{size:12}},grid:{color:'#1a2e4a'}},
        y:{ticks:{color:'#94a3b8',font:{size:12},callback:v=>'$'+(Math.abs(v)>=1000?(v/1000).toFixed(0)+'K':v)},grid:{color:'#1a2e4a'}}
      }
    }
  });
}

// Başlangıç: Supabase'den yükle
(async()=>{
  document.getElementById('app').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#07101f;color:#94a3b8;font-size:16px;font-family:Segoe UI,sans-serif">⏳ Veriler yükleniyor...</div>';
  const data=await loadWeeks();
  if(data&&data.length) S.weeks=data;
  S.loading=false;
  S.sel=S.weeks[S.weeks.length-1].id;
  render();
})();
</script>
